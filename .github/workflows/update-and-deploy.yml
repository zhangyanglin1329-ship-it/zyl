name: Update fund data and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "ops/nav-refresh-trigger.txt"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    # GitHub Actions cron is UTC. Entries below run on the preceding UTC date.
    # 16:17 UTC = 00:17 Asia/Shanghai (next calendar day)
    - cron: "17 16 * * *"
    # 18:17 UTC = 02:17 Asia/Shanghai (next calendar day)
    - cron: "17 18 * * *"
    # 20:17 UTC = 04:17 Asia/Shanghai (next calendar day)
    - cron: "17 20 * * *"
    # 22:17 UTC = 06:17 Asia/Shanghai (next calendar day)
    - cron: "17 22 * * *"
    # 23:17 UTC = 07:17 Asia/Shanghai (next calendar day)
    - cron: "17 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate NAV updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/update-multi-fund-data.ps1),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Update formal NAV data
        id: nav_refresh
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/update-multi-fund-data.ps1 `
            -HtmlPath ./site/index.html `
            -BackupDir "${{ runner.temp }}/fund-page-backups"

      - name: Save refreshed data in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update formal fund NAV data"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark failed NAV refresh
        if: ${{ steps.nav_refresh.outcome == 'failure' }}
        run: exit 1

