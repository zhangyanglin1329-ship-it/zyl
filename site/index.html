<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多基金波段执行系统 V2.4</title>
  <style>
/* Visual-only upgrade — 小倍 V1.5. No HTML, data or JS changes. */
:root{
  --ink:#1F2933;--text-2:#55616A;--muted:#66747B;--quiet:#7B898F;
  --bg:#FAF8F4;--paper:#FFFFFF;--soft:#F4F6F5;
  --teal:#0B4D5B;--teal-strong:#083E49;--teal-600:#0F6B7C;
  --teal-400:#78B7B4;--teal-200:#CFE6E4;--teal-100:#DDEDEC;--teal-50:#EFF6F5;
  --line:#D6E0DF;--line-strong:#C8D4D3;
  --rise:#D94248;--rise-text:#C9363D;
  --fall:#16895B;--fall-text:#137A50;
  --amber:#C88316;--amber-text:#8D610D;--amber-bg:#FFF7E8;
  --shadow:0 2px 8px rgba(22,23,25,.06);
  --font:Inter,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{touch-action:manipulation}
.shell{max-width:1280px;margin:0 auto;padding:36px 28px 64px}

/* Header — hierarchy before decoration */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
.eyebrow{color:var(--teal-600);font-size:12px;line-height:18px;font-weight:600;letter-spacing:.12em}
.top h1{margin:8px 0 4px;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.025em;color:var(--ink)}
.sub,.stamp{font-size:13px;line-height:20px;color:var(--text-2)}
.stamp{text-align:right;max-width:420px}
.live{color:var(--teal);font-weight:600}
.live.warning{color:var(--amber-text)}
.live.error{color:#B9363E}

/* Six independent interactive fund objects */
.overview-section{margin-bottom:20px}
.overview-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 2px 12px;color:var(--text-2);font-size:13px;line-height:20px;font-weight:500}
.mode{color:var(--teal-600);font-size:12px;line-height:18px;font-weight:600}
.fund-overview{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fund-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:start;gap:6px 7px;min-width:0;min-height:142px;border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:15px 13px;text-align:left;color:var(--ink);cursor:pointer;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease}
.fund-summary:hover{background:#F9FCFB;border-color:var(--line-strong)}
.fund-summary:focus-visible{outline:2px solid var(--teal-600);outline-offset:2px}
.fund-summary.active{border-color:var(--teal-400);background:var(--teal-50);box-shadow:inset 0 3px 0 var(--teal)}
.fund-summary-name{font-size:13px;line-height:20px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.fund-summary-code,.fund-summary-next,.fund-summary-parts,.fund-summary-state{font-size:11px;line-height:17px;color:var(--muted)}
.fund-summary-code,.fund-summary-next,.fund-summary-state{text-align:right}
.fund-summary-dd{font-size:25px;line-height:33px;font-weight:600;letter-spacing:-.035em;color:var(--fall-text)}
.fund-summary-state{font-weight:600}
.fund-summary.buy .fund-summary-state{color:var(--rise-text)}
.fund-summary.sell .fund-summary-state{color:var(--fall-text)}
.fund-summary.near .fund-summary-state{color:var(--amber-text)}
.fund-summary.blocked .fund-summary-state{color:var(--amber-text)}

/* System exception indicator */
.system-alert{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 18px;padding:14px 16px;background:var(--amber-bg);border:1px solid #EAD9B5;border-radius:12px;color:#76530C;font-size:13px;line-height:20px}
.system-alert[hidden]{display:none}
.system-alert button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid #D7BE8B;background:#fff;color:#76530C;cursor:pointer}
.system-alert button:hover{background:#FFFDF8}
.system-alert button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Strategy-first hero */
.hero{border:1px solid var(--line);border-radius:24px;background:var(--paper);padding:28px 28px 24px}
.hero-head{display:grid;grid-template-columns:minmax(160px,1fr) minmax(130px,.7fr) minmax(230px,1.35fr) minmax(178px,1fr);gap:28px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:24px}
.hero-head>div{min-width:0}
.label{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:20px}
.drawdown{font-size:44px;line-height:48px;font-weight:600;letter-spacing:-.045em;color:var(--fall-text);white-space:nowrap}
.next strong,.action strong{display:block;color:var(--ink);font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.025em;overflow-wrap:anywhere}
.action strong.buy{color:var(--rise-text)}
.action strong.sell{color:var(--fall-text)}
.action strong.stop,.action strong.blocked{color:var(--amber-text)}
.hero-position{min-width:0}
.hero-position .v{margin:0;font-size:23px;line-height:32px;font-weight:600;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.hero-position .progress{margin:10px 0 6px}

/* Performance visualization */
.chart-wrap{height:530px;padding-top:24px}
.performance-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.performance-head h2{margin:0;color:var(--ink);font-size:20px;line-height:28px;font-weight:600}
.chart-caption{font-size:12px;line-height:18px;color:var(--muted);text-align:right}
.range-row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:12px 0 7px}
.range-tabs{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.range-btn{min-height:36px;padding:0 11px;background:transparent;border:1px solid transparent;border-radius:999px;color:var(--text-2);font-size:13px;line-height:20px;white-space:nowrap;cursor:pointer;transition:background .16s ease,color .16s ease}
.range-btn:hover{background:var(--soft)}
.range-btn.active{border-color:var(--teal-200);background:var(--teal-50);color:var(--teal);font-weight:600}
.range-btn:focus-visible{outline:2px solid var(--teal-600);outline-offset:2px}
.custom-range{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.custom-range input{height:36px;min-width:0;max-width:146px;padding:0 8px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}
.custom-range[hidden]{display:none}
.custom-range input:focus-visible{outline:2px solid var(--teal-600);outline-offset:2px}
.chart-wrap svg{width:100%;height:calc(100% - 96px);overflow:visible}
.grid-line{stroke:#E8EFEE;stroke-width:1}
.axis{fill:var(--muted);font-size:11px}
.curve-shadow{fill:none;stroke:var(--teal-200);stroke-width:7;opacity:.6}
.curve{fill:none;stroke:var(--teal-600);stroke-width:2.3}
.high-line{stroke:var(--rise);stroke-width:1.2;stroke-dasharray:6 6}
.next-buy-line{stroke:var(--teal);stroke-width:1.2;stroke-dasharray:4 5}
.current-point{fill:#fff;stroke:var(--teal);stroke-width:3}
.chart-label{font-size:12px;fill:var(--text-2)}
.chart-label.high{fill:var(--rise-text);font-weight:600}
.chart-label.next-buy{fill:var(--teal);font-weight:600}
.chart-value{font-size:13px;fill:var(--ink);font-weight:600}
.signal-buy{fill:var(--rise);stroke:#fff;stroke-width:1.2}
.signal-sell{fill:var(--fall);stroke:#fff;stroke-width:1.2}
.signal-marker{filter:drop-shadow(0 1px 2px rgba(31,41,51,.16))}
.signal-text{font-size:10px;font-weight:700}
.signal-text.buy{fill:var(--rise-text)}
.signal-text.sell{fill:var(--fall-text)}
.signal-legend text{font-size:11px;fill:var(--text-2)}

/* Fixed buy-step ladder */
.content{margin-top:24px}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:24px}
.section-title{margin-bottom:18px}
.section-title h2,.section-heading h2{margin:0 0 6px;font-size:20px;line-height:28px;font-weight:600;color:var(--ink)}
.section-heading>span,.section-title span{font-size:13px;line-height:20px;color:var(--muted)}
.k{color:var(--muted);font-size:12px;line-height:18px;letter-spacing:.04em}
.v{margin:6px 0;font-size:25px;line-height:32px;font-weight:600}
.progress{height:6px;background:var(--teal-100);border-radius:999px;overflow:hidden}
.progress i{display:block;width:0;height:100%;background:var(--teal-600);border-radius:999px}
.small{color:var(--text-2);font-size:12px;line-height:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.step{min-height:91px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.step .pct{color:var(--ink);font-size:15px;line-height:22px;font-weight:600}
.step .qty,.step .state{margin-top:6px;font-size:12px;line-height:17px;color:var(--muted)}
.step .state{margin-top:8px}
.step.done{background:var(--soft);border-color:#D4E6E2}
.step.done .state{color:var(--fall-text)}
.step.current{border-color:var(--teal-400);background:var(--teal-50)}
.step.current .pct,.step.current .state{color:var(--teal);font-weight:600}

/* Notes: editorial, not another card */
.notes{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;line-height:21px;color:var(--text-2)}
.notes-title{margin-bottom:8px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink)}
.notes p{margin:6px 0}
.foot{display:flex;justify-content:space-between;gap:20px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}

@media(max-width:1180px){
  .shell{padding:28px 24px 56px}
  .hero-head{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 30px}
  .fund-overview{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:720px){
  .shell{padding:22px 16px 48px}
  .top{align-items:flex-start;flex-direction:column;gap:12px;margin-bottom:24px}
  .top h1{font-size:26px;line-height:34px}
  .stamp{text-align:left}
  .overview-head{align-items:flex-start;gap:6px;flex-wrap:wrap}
  .fund-overview{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(188px,1fr);overflow-x:auto;padding-bottom:5px}
  .fund-summary{min-height:138px}
  .hero{padding:20px 18px;border-radius:20px}
  .hero-head{grid-template-columns:1fr;gap:16px;padding-bottom:20px}
  .drawdown{font-size:40px;line-height:44px}
  .chart-wrap{height:500px;padding-top:20px}
  .performance-head{align-items:flex-start;flex-direction:column;gap:4px}
  .chart-caption{text-align:left}
  .range-row{align-items:flex-start}
  .range-tabs{gap:2px}
  .range-btn{padding:0 10px}
  .chart-wrap svg{height:calc(100% - 122px)}
  .panel{padding:20px 18px}
  .steps{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .foot{flex-direction:column;gap:8px}
  .system-alert{align-items:flex-start;flex-direction:column;gap:12px}
}
@media(prefers-reduced-motion:reduce){
  .fund-summary,.range-btn{transition:none}
}
  </style>
</head>

</main>

    $("#fundSub").textContent = fund.category + " · 基金代码 " + fund.code + " · 分红再投资复权净值";
    const checkLabel = UPDATE_STATUS.success === true ? "成功检查 " + (UPDATE_STATUS.checkedAt || "未知") : "检查失败 " + (UPDATE_STATUS.checkedAt || "未知") + " · 净值未变";
    $("#dataStamp").textContent = "净值日期 " + fund.latestDate + " · 历史 " + fund.rows + " 条 · " + checkLabel + " · 页面≤3分钟自动刷新";
    $("#sourceStamp").textContent = health.blocked ? "数据待核验 · 策略暂停" : "双源自动更新已核验";
    $("#sourceStamp").className = "live " + health.level;
    const alertText = health.blocked ? health.text : "";
    $("#systemAlertText").textContent = alertText;
    $("#systemAlert").hidden = !alertText;
  }

  function renderMetrics(view, action) {
    const { fund, dd, next, currentParts } = view;
    $("#drawdownText").textContent = fmtPct(dd);
    $("#nextText").textContent = action.mode !== "blocked" && next ? levelText(next[0]) : "—";
    $("#actionText").textContent = action.text;
    $("#actionText").className = action.mode;
    $("#usedText").textContent = currentParts;
    $("#totalPartsText").textContent = fund.totalParts;
    $("#remainText").textContent = Math.max(0, fund.totalParts - currentParts);
    $("#progressBar").style.width = Math.min(100, currentParts / fund.totalParts * 100) + "%";
    $("#modeText").textContent = action.mode === "blocked" ? "策略信号已暂停" : "策略自动计算";
  }

  function renderFundOverview(views, health) {
    $("#fundOverview").innerHTML = FUND_ORDER.map(code => {
      const view = views[code];
      const action = actionFor(view, health);
      const distance = view.next ? Math.max(0, view.next[0] + view.dd) : null;
      const near = action.mode === "wait" && distance != null && distance <= 0.5;
      const stateClass = near ? "near" : action.mode;
      const stateText = action.mode === "blocked" ? "数据待核验" : action.mode === "buy" ? "买入信号"
        : action.mode === "sell" ? "卖出信号"
        : action.mode === "stop" ? "买点已用完"
        : near ? "临近买点 " + distance.toFixed(2) + "%"
        : distance == null ? "等待信号" : "距买点 " + distance.toFixed(2) + "%";
      return '<button type="button" class="fund-summary ' + stateClass + (code === selectedCode ? " active" : "") + '" data-code="' + code + '" aria-pressed="' + (code === selectedCode) + '"><span class="fund-summary-name">' + view.fund.shortName + '</span><span class="fund-summary-code">' + code + '</span><span class="fund-summary-dd">' + fmtPct(view.dd) + '</span><span class="fund-summary-next">' + (health.blocked ? "策略暂停" : "下一 " + (view.next ? levelText(view.next[0]) : "—")) + '</span><span class="fund-summary-parts">本轮 ' + view.currentParts + ' / ' + view.fund.totalParts + ' 份</span><span class="fund-summary-state">' + stateText + '</span></button>';
    }).join("");
  }

  function renderSteps(view, blocked) {
    const { fund, next, triggered } = view;
    $("#steps").innerHTML = fund.ladder.map(([level, parts]) => {
      let cls = "wait", status = "等待";
      if (triggered.has(level)) { cls = "done"; status = "本轮已触发"; }
      else if (!blocked && next && level === next[0]) { cls = "current"; status = "下一买点"; }
      return '<div class="step ' + cls + '"><div class="pct">' + levelText(level) + '</div><div class="qty">买 ' + parts + ' 份</div><div class="state">' + status + '</div></div>';
    }).join("");
    $("#ladderSummary").textContent = fund.ladder.length + " 个固定买点 · 波段资金 " + fund.totalParts + " 份";
  }

  function renderStrategy(view) {
    const { fund, currentParts } = view;
    $("#allocationText").textContent = "核心仓 " + fund.core + "% / 波段仓 " + fund.swing + "%";
    $("#sellRuleText").textContent = fund.minHoldDays ? "回撤归零 + 持有满 " + fund.minHoldDays + " 天" : "回撤归零卖出";
    $("#feeRuleText").textContent = fund.minHoldDays ? "未满足持有期的批次继续锁定，避免短期赎回费。" : "沿用已验收的金信卖出规则。";
    $("#strategyNoteText").textContent = "本轮策略已投入由回测买入信号自动汇总，与实际执行无关。";
  }

  function renderChart(view, blocked) {
    const { fund, dd, next, signals } = view;
    const latest = new Date(fund.latestDate + "T00:00:00Z");
    const firstDate = fund.data[0][0];
    $("#customStart").min = firstDate;
    $("#customStart").max = fund.latestDate;
    $("#customEnd").min = firstDate;
    $("#customEnd").max = fund.latestDate;
    let startDate = null;
    let endDate = fund.latestDate;
    let rangeLabel = "全部历史";
    if (chartRange === "CUSTOM") {
      customStart = customStart && customStart >= firstDate && customStart <= fund.latestDate ? customStart : firstDate;
      customEnd = customEnd && customEnd >= firstDate && customEnd <= fund.latestDate ? customEnd : fund.latestDate;
      if (customStart > customEnd) [customStart, customEnd] = [customEnd, customStart];
      startDate = customStart;
      endDate = customEnd;
      rangeLabel = customStart + " 至 " + customEnd;
      $("#customStart").value = customStart;
      $("#customEnd").value = customEnd;
    } else if (chartRange !== "ALL") {
      const start = new Date(latest);
      if (chartRange === "1M") start.setUTCMonth(start.getUTCMonth() - 1);
      if (chartRange === "3M") start.setUTCMonth(start.getUTCMonth() - 3);
      if (chartRange === "6M") start.setUTCMonth(start.getUTCMonth() - 6);
      if (chartRange === "YTD") start.setUTCMonth(0, 1);
      if (chartRange === "1Y") start.setUTCFullYear(start.getUTCFullYear() - 1);
      if (chartRange === "3Y") start.setUTCFullYear(start.getUTCFullYear() - 3);
      if (chartRange === "5Y") start.setUTCFullYear(start.getUTCFullYear() - 5);
      startDate = start.toISOString().slice(0, 10);
      rangeLabel = { "1M": "近1月", "3M": "近3月", "6M": "近6月", "YTD": "今年以来", "1Y": "近1年", "3Y": "近3年", "5Y": "近5年" }[chartRange];
    }
    const filtered = fund.data.filter(row => (!startDate || row[0] >= startDate) && row[0] <= endDate);
    const data = filtered.length ? filtered : [fund.data.at(-1)];
    const W = 1180, H = 420, L = 70, R = 30, T = 34, B = 44;
    const values = data.map(row => row[1]);
    const isLatestPoint = data.at(-1)[0] === fund.latestDate;
    const rangeHigh = Math.max(...values);
    const rangePeakDate = data[values.indexOf(rangeHigh)][0];
    const referenceHigh = isLatestPoint ? fund.high : rangeHigh;
    const referencePeakDate = isLatestPoint ? fund.peakDate : rangePeakDate;
    const nextValue = !blocked && isLatestPoint && next ? fund.high * (1 - next[0] / 100) : null;
    const rawMin = Math.min(...values, nextValue ?? Infinity), rawMax = Math.max(...values, referenceHigh);
    const pad = Math.max((rawMax - rawMin) * 0.1, rawMax * 0.01);
    const min = rawMin - pad, max = rawMax + pad;
    const y = value => T + (max - value) / (max - min) * (H - T - B);
    const x = index => L + index * (W - L - R) / Math.max(1, data.length - 1);
    const points = data.map((row, index) => [x(index), y(row[1])]);
    const path = points.map((point, index) => (index ? "L" : "M") + point[0].toFixed(1) + "," + point[1].toFixed(1)).join(" ");
    const ticks = Array.from({ length: 5 }, (_, index) => min + (max - min) * index / 4);
    const grid = ticks.map(value => '<line class="grid-line" x1="' + L + '" y1="' + y(value) + '" x2="' + (W - R) + '" y2="' + y(value) + '"/><text class="axis" x="8" y="' + (y(value) + 4) + '">' + value.toFixed(3) + "</text>").join("");
    const dateLabels = [0, .25, .5, .75, 1].map(fraction => {
      const index = Math.min(data.length - 1, Math.round((data.length - 1) * fraction));
      const anchor = fraction === 0 ? "start" : fraction === 1 ? "end" : "middle";
      return '<text class="axis" text-anchor="' + anchor + '" x="' + x(index) + '" y="' + (H - 9) + '">' + data[index][0] + "</text>";
    }).join("");
    const highY = y(referenceHigh), currentPoint = points.at(-1);
    const dataIndex = new Map(data.map((row, index) => [row[0], index]));
    const visibleSignals = signals.filter(signal => dataIndex.has(signal.date));
    const showSignalLabels = visibleSignals.length <= 12;
    const signalMarkup = visibleSignals.map(signal => {
      const isBuy = signal.type === "buy";
      const rawPx = x(dataIndex.get(signal.date)), py = y(signal.value);
      const overlapsCurrentPoint = !isBuy && isLatestPoint && signal.date === data.at(-1)[0];
      const px = overlapsCurrentPoint ? rawPx - 14 : rawPx;
      const shape = isBuy
        ? '<path class="signal-buy" d="M ' + px + ' ' + (py - 9) + ' L ' + (px - 6) + ' ' + (py + 2) + ' L ' + (px + 6) + ' ' + (py + 2) + ' Z"/>'
        : '<path class="signal-sell" d="M ' + px + ' ' + (py + 9) + ' L ' + (px - 6) + ' ' + (py - 2) + ' L ' + (px + 6) + ' ' + (py - 2) + ' Z"/>';
      const levels = signal.levels.map(levelText).join("、");
      const title = isBuy
        ? signal.date + " 买入信号｜触发 " + levels + "｜合计 " + signal.parts + " 份"
        : signal.date + " 卖出信号｜回撤归零｜本轮信号 " + signal.parts + " 份";
      const label = showSignalLabels ? '<text class="signal-text ' + signal.type + '" x="' + (px + 8) + '" y="' + (py + (isBuy ? -7 : 13)) + '">' + (isBuy ? "买" : "卖") + "</text>" : "";
      return '<g class="signal-marker ' + signal.type + '"><title>' + title + "</title>" + shape + label + "</g>";
    }).join("");
    const buyCount = visibleSignals.filter(signal => signal.type === "buy").length;
    const sellCount = visibleSignals.filter(signal => signal.type === "sell").length;
    const legend = '<g class="signal-legend"><circle class="signal-buy" cx="' + (W - 220) + '" cy="18" r="4"/><text x="' + (W - 210) + '" y="22">买入信号</text><rect class="signal-sell" x="' + (W - 130) + '" y="14" width="8" height="8"/><text x="' + (W - 116) + '" y="22">卖出信号</text></g>';
    const nextLine = nextValue == null ? "" : '<line class="next-buy-line" x1="' + L + '" y1="' + y(nextValue) + '" x2="' + (W - R) + '" y2="' + y(nextValue) + '"/><text class="chart-label next-buy" x="' + (L + 10) + '" y="' + (y(nextValue) + 16) + '">下一买点 ' + levelText(next[0]) + ' · 复权净值 ' + nextValue.toFixed(6) + "</text>";
    const pointTitle = isLatestPoint ? "当前 " + fund.current.toFixed(6) : "区间末值 " + data.at(-1)[1].toFixed(6);
    const pointSub = isLatestPoint ? fmtPct(dd) : data.at(-1)[0];
    const highLabel = isLatestPoint ? "策略基准高点" : "区间最高点";
    $("#chart").innerHTML = grid + '<line class="high-line" x1="' + L + '" y1="' + highY + '" x2="' + (W - R) + '" y2="' + highY + '"/><text class="chart-label high" x="' + (L + 10) + '" y="' + (highY - 8) + '">' + highLabel + ' · ' + referencePeakDate + "</text>" + nextLine + '<path class="curve-shadow" d="' + path + '"/><path class="curve" d="' + path + '"/><circle class="current-point" cx="' + currentPoint[0] + '" cy="' + currentPoint[1] + '" r="6"/><text class="chart-value" text-anchor="end" x="' + (currentPoint[0] - 12) + '" y="' + (currentPoint[1] - 13) + '">' + pointTitle + '</text><text class="chart-label" text-anchor="end" x="' + (currentPoint[0] - 12) + '" y="' + (currentPoint[1] + 19) + '">' + pointSub + "</text>" + signalMarkup + dateLabels + legend;
    $("#chartCaption").textContent = "分红再投资复权净值 · " + rangeLabel + " · " + data.length + " 条 · 买入信号日 " + buyCount + " / 卖出信号日 " + sellCount + (blocked ? " · 数据异常，历史信号仅供查看" : "");
  }

  function render() {
    const views = Object.fromEntries(FUND_ORDER.map(code => [code, getView(code)]));
    const view = views[selectedCode];
    const health = dataHealth();
    const action = actionFor(view, health);
    renderFundOverview(views, health); renderHeader(view, health); renderMetrics(view, action); renderSteps(view, health.blocked); renderStrategy(view); renderChart(view, health.blocked);
    document.querySelectorAll(".range-btn").forEach(button => {
      const active = button.dataset.range === chartRange;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    $("#customRange").hidden = chartRange !== "CUSTOM";
  }

  function initFundOverview() {
    $("#fundOverview").addEventListener("click", event => {
      const button = event.target.closest(".fund-summary");
      if (!button) return;
      selectedCode = button.dataset.code;
      localStorage.setItem(SELECTED_KEY, selectedCode);
      customStart = localStorage.getItem(CUSTOM_START_KEY + selectedCode) || "";
      customEnd = localStorage.getItem(CUSTOM_END_KEY + selectedCode) || "";
      render();
    });
  }

  function reloadLatestFile() {
    if (reloadStarted) return;
    const active = document.activeElement;
    reloadStarted = true;
    location.reload();
  }

  function reloadWhenReturning() {
    if (!document.hidden && Date.now() - PAGE_LOADED_AT >= FOCUS_RELOAD_AFTER_MS) reloadLatestFile();
  }

  document.querySelectorAll(".range-btn").forEach(button => button.addEventListener("click", () => {
    chartRange = button.dataset.range;
    localStorage.setItem(RANGE_KEY, chartRange);
    if (chartRange === "CUSTOM") {
      const fund = DB[selectedCode];
      customStart = customStart || fund.data[0][0];
      customEnd = customEnd || fund.latestDate;
      localStorage.setItem(CUSTOM_START_KEY + selectedCode, customStart);
      localStorage.setItem(CUSTOM_END_KEY + selectedCode, customEnd);
    }
    render();
  }));
  $("#customStart").addEventListener("input", event => {
    customStart = event.target.value;
    localStorage.setItem(CUSTOM_START_KEY + selectedCode, customStart);
    render();
  });
  $("#customEnd").addEventListener("input", event => {
    customEnd = event.target.value;
    localStorage.setItem(CUSTOM_END_KEY + selectedCode, customEnd);
    render();
  });

  $("#refreshBtn").addEventListener("click", () => location.reload());
  setInterval(render, 300000);
  setInterval(reloadLatestFile, AUTO_RELOAD_MS);
  document.addEventListener("visibilitychange", reloadWhenReturning);
  window.addEventListener("focus", reloadWhenReturning);

  initFundOverview(); render();
})();</script>
</body>
</html>
