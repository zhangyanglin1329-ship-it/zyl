function companyTopRows(metricKey){
  const getVal=(x)=>{
    const raw={addUsers:x.addUsers,addAmount:x.addAmount,reduceUsers:x.reduceUsers,investUsers:x.investUsers,favUsers:x.favUsers,heat:x.heat}[metricKey]||x.addUsers;
    return parseFloat(String(raw).replace(/,/g,''))||0;
  };
  const showVal=(x)=>({addUsers:x.addUsers,addAmount:x.addAmount,reduceUsers:x.reduceUsers,investUsers:x.investUsers,favUsers:x.favUsers,heat:x.heat}[metricKey]||x.addUsers);
  return [...funds].sort((a,b)=>getVal(b)-getVal(a)).slice(0,5).map(x=>[x.name,x.code,x.sector,showVal(x)]);
}

function voiceInsight(kind,obj){
  const name = kind==='sector' ? obj.name : obj.name;
  const isSector = kind==='sector';
  const baseTopic = isSector ? obj.name : obj.sector;
  const cardSpan = 's12';
  const count = obj.dynamic;
  const positive = obj.positive;
  const topics = isSector
    ? ['板块持续性','相关基金选择','短期波动','是否追高','持有信心']
    : ['短期回撤','是否补仓','定投节奏','持有信心','同板块表现'];

    ? [baseTopic,'加仓','回调','产业链','波动','基金选择','搜索']

    : `近 7 日用户讨论集中在${name}的短期波动、定投节奏和是否继续持有。整体情绪偏谨慎，部分用户仍表达继续观察和分批处理的意愿。`;
  const voices = isSector
    ? [
      [`${baseTopic}最近关注度挺高，但涨得快了还是想再观察一下。`,'板块持续性｜谨慎'],
      [`想看看这个方向里哪些基金关联度更高，不想只看涨幅。`,'基金选择｜中性'],

        <div>

        <div class="insightMetric"><div class="k">近 7 日正向情绪占比</div><div class="v">${positive}</div></div>
      </div>
      <div class="aiSummary">${summary}</div>
      <div class="insightLayout">
        <div>
          <div class="insightBlocks">
            <div class="insightBlock"><div class="miniTitle">用户关注点</div><div class="tagList">${topics.map(t=>`<span class="topicTag">${t}</span>`).join('')}</div></div>
            <div class="insightBlock"><div class="miniTitle">高频关键词</div><div class="tagList">${keywords.map(t=>`<span class="keywordTag">${t}</span>`).join('')}</div></div>
          </div>
        </div>
        <div>
          <div class="miniTitle">典型原声</div>
          <div class="voiceList">${voices.map(v=>`<div class="voiceCard"><div class="voiceText">“${v[0]}”</div><div class="voiceMeta">${v[1]}</div></div>`).join('')}</div>

function sectorList(){setTitle('板块监控');app.innerHTML=`<div class="card">${table(['板块名称','板块搜索人数','搜索排名','关联基金数','本公司关联基金数','本公司最热关联产品'],sectors.map(s=>`<tr class="clickable" onclick="openSector('${s.name}')"><td>${s.name}</td><td>${s.heat}</td><td>#${s.rank}</td><td>${s.funds}</td><td>${s.companyFunds}</td><td>${s.hottest}</td></tr>`))}<div class="notice">板块搜索人数为统计周期内搜索该板块或相关关键词的去重用户人数；列表页不展示动态数量。</div>${fieldNotes('sector')}</div>`}
function sectorDetail(){const s=sectors.find(x=>x.name===state.sector)||sectors[0];setTitle(`${s.name} 板块监控`);app.innerHTML=`<div class="crumb"><button class="back" onclick="go('sectorList')">‹ 返回板块列表</button><div class="dateRange">2026/06/02　-　2026/06/09</div></div>${metric([['板块搜索人数',s.heat,'较昨日','+11.2%'],['搜索排名','#'+s.rank,'较昨日','↑1'],['关联基金数',s.funds,'全市场',''],['本公司关联基金数',s.companyFunds,'本公司','']])}<div class="card"><div class="splitHead"><div><h3>板块趋势图</h3><div class="desc">板块搜索人数与搜索排名同图展示，支持分时和日维度查看。</div></div></div><div class="controlPanel"><div class="controlBlock"><span class="controlLabel">图表数据</span><span class="tag orange">板块搜索人数</span><span class="tag blue">搜索排名</span><span class="viewNote">左轴：搜索人数；右轴：搜索排名</span></div><div class="controlBlock"><span class="controlLabel">时间维度</span><button class="pill ${state.sectorPeriod==='minute'?'active':''}" onclick="state.sectorPeriod='minute';render()">分时</button><button class="pill ${state.sectorPeriod==='day'?'active':''}" onclick="state.sectorPeriod='day';render()">日</button></div></div><div class="chart" id="sectorTrend"></div></div><div class="card"><div class="splitHead"><div><h3>本公司基金在板块内表现</h3><div class="desc">搜索视角展示 Top5 + 本公司最热关联基金；关注和加仓视角只展示本公司基金表现。</div></div><div class="seg">${[['heat','搜索视角'],['fav','关注视角'],['add','加仓视角']].map(([k,t])=>`<button class="pill ${state.sectorView===k?'active':''}" onclick="state.sectorView='${k}';render()">${t}</button>`).join('')}</div></div>${sectorPerformance(s.name)}</div><div class="grid">${voiceInsight('sector',s)}</div>${fieldNotes('sector')}`}
function sectorPerformance(name){
const data=sectorRows[name]||sectorRows['半导体'];
const nameCell=(r)=>`${r[1]}${r[3]?' <span class="tag orange">本公司</span>':''}`;
if(state.sectorView==='heat'){
  const rows=data.heat.map((r,i)=>`${i===5?'<tr class="rankSep"><td colspan="5">本公司最热关联基金</td></tr>':''}<tr class="${r[3]?'companyRow ':''}clickable" ${r[3]?`onclick="openFund('${r[2]}')"`:''}><td>第${r[0]}名</td><td>${nameCell(r)}</td><td>${r[2]}</td><td>${r[4]}</td><td>#${r[0]}</td></tr>`);
  return table(['排名','基金名称','基金代码','搜索人数','板块内搜索排名'],rows);
}
function rangeRows(rows,mode){
  const company=rows.find(r=>r[2])||rows[1];
  const n=parseInt(company[0],10)||1;
  const code=codeByName(company[1]);
  if(mode==='fav'){
    return table(['基金名称','基金代码','自选人数','板块内排名','相对位置'],[
      `<tr class="companyRow clickable" onclick="openFund('${code}')"><td>${company[1]} <span class="tag orange">本公司</span></td><td>${code}</td><td>${company[3]}</td><td>第 ${n} 名</td><td>${positionLabel(n)}</td></tr>`
    ]);
  }
  return table(['基金名称','基金代码','加仓人数','加仓金额','板块内排名','相对位置'],[
    `<tr class="companyRow clickable" onclick="openFund('${code}')"><td>${company[1]} <span class="tag orange">本公司</span></td><td>${code}</td><td>${company[3]}</td><td>${company[4]}</td><td>第 ${n} 名</td><td>${positionLabel(n)}</td></tr>`
  ]);
}
if(state.sectorView==='fav')return rangeRows(data.fav,'fav');
return rangeRows(data.add,'add');
}

function ec(id,opt){const el=document.getElementById(id);if(el&&window.echarts)echarts.init(el).setOption(opt)}

}
